id: system-one-return-blocked
name: Observe and repair a blocked return route after cave resupply
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain one raw iron beyond a long cave. The fixture supplies a stone pickaxe
  and torches, and exposes wood and a furnace near the entrance. Carried torches
  are removed after fifty-two blocks of cave progress. Obtain replacement
  lighting supplies, return to the suspended exploration, and reach the ore.
  After supplies are ready, the fixture blocks the remembered corridor with
  a two-block-high stone wall. Observe the change and recover the return route.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 18000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: lighting_supply
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:inventory_observed:minecraft:torch:8
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: prepare_observed_access
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:access_stance_reached
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
