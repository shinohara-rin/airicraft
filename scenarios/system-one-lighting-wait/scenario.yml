id: system-one-lighting-wait
name: Maintain working light during a furnace wait
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: Obtain one iron_ingot. The evaluator removes the chamber light after the furnace starts cooking. Restore working light and resume the interrupted task.
goal:
  kind: inventory_item
  itemId: minecraft:iron_ingot
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:iron_ingot
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: lighting_placement
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:working_light_observed
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
