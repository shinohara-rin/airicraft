id: system-one-iron
name: Exposed resources to iron pickaxe through production tasks
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain a iron pickaxe from an empty inventory. The evaluator supplies
  exposed logs, stone, iron ore, and coal ore. No tools,
  ingredients, workstation coordinates, or action sequence are supplied.
goal:
  kind: inventory_item
  itemId: minecraft:iron_pickaxe
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 12000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:iron_pickaxe
    count: 1
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
