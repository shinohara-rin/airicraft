id: system-one-survival-wait
name: Escape an observed hazard during a passive furnace wait
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Smelt one iron ingot using the supplied raw iron, coal, and exposed furnace.
  The fixture introduces lava beside the player after the furnace wait begins.
  Release ordinary work, reach an observed refuge, and complete the smelting goal.
goal:
  kind: inventory_item
  itemId: minecraft:iron_ingot
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 3000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:iron_ingot
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: survival_escape
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:survival_refuge_observed
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
