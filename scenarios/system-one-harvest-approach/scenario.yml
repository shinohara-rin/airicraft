id: system-one-harvest-approach
name: Prepare an approach to observed ore below a ledge
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain raw iron visible across a lower chamber. A two-block drop separates
  the starting ledge from the chamber floor. Prepare an observed approach
  to the ore without enlarging the allowed fall or abandoning the target.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: prepare_observed_access
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:access_stance_reached
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
