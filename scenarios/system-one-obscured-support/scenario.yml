id: system-one-obscured-support
name: Clear visible litter to inspect hidden support
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: Obtain raw iron in the lit passage, clearing visible litter when it prevents observing the support below it.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.motor_effect
    payload:
      commandType: Break
      targetBlock: minecraft:leaf_litter
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
