id: system-one-pickup-step
name: Prepare a one-step approach to a low iron pickup
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain the visible raw iron below the lit chamber. Prepare an observed
  approach to collect the drop, preserving standing support and bounded steps.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 3000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: prepare_observed_access
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
