id: system-one-descent
name: Finish descending steps after clearing their headroom
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain raw iron by exploring from a lit chamber in solid terrain. The fixture
  supplies a stone pickaxe and torches. Open each descending step through
  observed surfaces without turning the cleared headroom into a flat tunnel.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
