id: system-one-dim-health-loss
name: Revoke dim coal search after observed health loss
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
# Fault fixture: the inventory goal is expected to fail after safe withdrawal.
# Verify the explicit revocation, Stop/Released ordering, and no coal mining in the recording.
prompt: >-
  Craft four torches. The evaluator injects health loss during reduced-light
  soil mining. Revoke the allowance and retreat before continuing the search.
goal:
  kind: inventory_item
  itemId: minecraft:torch
  quantity: 4
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:torch
    count: 4
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: search:minecraft:coal
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: lighting_retreat
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
