id: system-one-trunk-descent
name: "Descend an observed trunk to reach local stone"
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain three cobblestone using local excavation. The evaluator prepares
  an isolated stone floor below a tall trunk and supplies a wooden pickaxe.
goal:
  kind: inventory_item
  itemId: minecraft:cobblestone
  quantity: 3
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 6000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:cobblestone
    count: 3
  - type: event_contains
    eventType: system_one.motor_effect
    payload:
      commandType: Break
      targetBlock: minecraft:dark_oak_log
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
