id: system-one-lighting-low-ceiling
name: Light and traverse a two-block-high cave
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: Obtain one raw iron, repairing lighting supply as necessary during cave exploration.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 6000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: lighting_supply
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:inventory_observed:minecraft:torch:8
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:working_light_observed
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
