id: system-one-tool-wear
name: Replace a worn pickaxe and resume underground exploration
metadata:
  minecraftVersion: 1.21.8
  airicraftVersion: dev
worldArchive: ../iron-pickaxe/world.zip
frozen: true
prompt: >-
  Obtain raw iron below a lit chamber. The stone pickaxe has two uses remaining.
  A crafting table and replacement materials are available at the start.
  Replace the tool when it wears out and resume the same underground search.
goal:
  kind: inventory_item
  itemId: minecraft:raw_iron
  quantity: 1
budget:
  maxPlannerTurns: 0
  maxElapsedTicks: 4000
  maxElapsedMillis: 0
  heartbeatIntervalTicks: 80
checks:
  - type: inventory_contains
    itemId: minecraft:raw_iron
    count: 1
  - type: event_contains
    eventType: system_one.task_suspended
    payload:
      detail: tool_replacement:minecraft:stone_pickaxe
  - type: event_contains
    eventType: system_one.task_resumed
    payload:
      detail: SUCCEEDED:inventory_observed:minecraft:stone_pickaxe:1
evidence:
  includePlannerJournal: true
  includeDebugTimeline: true
  includeRecentEvents: true
  includeTaskState: true
  includeWorldSnapshot: true
