pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

dependencyResolutionManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev'
		}
		mavenCentral()
	}
}

include("wrapper")

def includeAllCompat = gradle.startParameter.projectProperties.get("airicraft.includeCompat") == "true"

if (includeAllCompat || gradle.startParameter.projectProperties.get("airicraft.includeReiCompat") == "true") {
	include("compat:rei")
}

if (includeAllCompat || gradle.startParameter.projectProperties.get("airicraft.includeJourneyMapCompat") == "true") {
	include("compat:journeymap")
}
